<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona 5 Prototypes</title>
    <style>
        :root {
            --p5-red: #D92323;
            --p5-bg: #0a0a0a;
            --p5-white: #FFFFFF;
            --p5-black: #000000;
            --p5-yellow: #FFCF00;
        }

        body {
            background-color: var(--p5-bg);
            /* Authentic Red Dot Grid Texture */
            background-image: radial-gradient(var(--p5-red) 1.2px, transparent 1.2px);
            background-size: 24px 24px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* High-Contrast "Calling Card" Header */
        h1 {
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-style: italic;
            font-size: 3.5rem;
            text-transform: uppercase;
            background-color: var(--p5-white);
            color: var(--p5-black);
            padding: 10px 60px;
            transform: rotate(-2deg) skew(-5deg);
            box-shadow: 18px 18px 0px var(--p5-red);
            margin-bottom: 40px;
            z-index: 10;
            border: 5px solid var(--p5-black);
        }

        .link-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 550px;
            z-index: 5;
        }

        /* Image-Based Magnet Links */
        a {
            text-decoration: none;
            background-color: var(--p5-red);
            padding: 10px 20px;
            transition: 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform: skew(-12deg);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid var(--p5-white);
        }

        a img {
            max-width: 100%;
            height: auto;
            /* Inverts the black text inside the PNGs for a sharp white look */
            filter: drop-shadow(2px 2px 0px var(--p5-black));
        }

        /* Hover Effect: Changes the button to iconic P5 Yellow */
        a:hover {
            background-color: var(--p5-yellow);
            transform: skew(-12deg) scale(1.05) translateX(10px);
            box-shadow: -10px 10px 0px var(--p5-white);
        }

        /* Fixed Character Positioning */
        .char-art {
            position: fixed;
            bottom: -5px;
            z-index: 1;
            pointer-events: none;
            object-fit: contain;
        }

        .joker {
            left: 20px;
            height: 65vh;
        }

        .morgana {
            right: 15px;
            height: 50vh;
        }

        @media (max-width: 1100px) {
            .char-art { opacity: 0.3; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
